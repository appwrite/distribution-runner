name: Fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: detect
        run: |
          if [ -f images/fixture/generate.sh ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip: images/fixture/generate.sh not found'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate
        if: steps.detect.outputs.enabled == 'true'
        run: make fixture-generate

      - if: steps.detect.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture
          path: |
            images/fixture/app-unsigned.aab
            images/fixture/provenance.json
          if-no-files-found: error
