name: Images

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.diff.outputs.tools }}
      fixture: ${{ steps.diff.outputs.fixture }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD")
          tools=false
          fixture=false
          android=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/images.yml|Makefile|.trivyignore) tools=true fixture=true android=true ;;
            esac
            case "$file" in
              images/tools/*|images/fixture/*|tests/Dockerfile|tests/*.bats|tests/helpers.bash|tests/*.py) tools=true ;;
            esac
            case "$file" in
              images/fixture/*|images/tools/*|tests/fixture.sh) fixture=true ;;
            esac
            case "$file" in
              images/android/*|tests/android.sh) android=true ;;
            esac
          done <<< "$files"
          {
            echo "tools=$tools"
            echo "fixture=$fixture"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
          echo "changed: tools=$tools fixture=$fixture android=$android"

  build:
    needs: [lint, changes]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.changes.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tools
            build: tools tools-test
            arm64: true
          - image: fixture
            build: tools fixture
            arm64: true
          - image: android
            build: android
            arm64: false
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          IMAGE: ${{ matrix.image }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          CHANGED: ${{ needs.changes.outputs[matrix.image] }}
        run: |
          enabled=false
          publish=false
          version=dev
          if [ ! -f "images/$IMAGE/Dockerfile" ]; then
            echo "skip: images/$IMAGE/Dockerfile not found"
          elif [ "$EVENT" = push ] || [ "$CHANGED" = true ]; then
            enabled=true
          else
            echo "skip: no changes affect $IMAGE"
          fi
          if [ "$enabled" = true ] && [ "$EVENT" = push ] && [ "${REF#refs/tags/}" != "$REF" ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $REF_NAME points at $GITHUB_SHA, which is not on main; only commits on main are published"
              exit 1
            fi
            version=$REF_NAME
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              publish=true
            else
              echo '::warning::DOCKERHUB_USERNAME is not set, the tag builds and tests but does not publish'
            fi
          fi
          {
            echo "enabled=$enabled"
            echo "publish=$publish"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          {
            echo "TAG=$version"
            echo "VERSION=$version"
          } >> "$GITHUB_ENV"

      - name: Prepare disk
        if: steps.detect.outputs.enabled == 'true' && matrix.image == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /usr/share/swift /opt/hostedtoolcache/CodeQL
          if [ ! -d /mnt ]; then
            echo '::error::/mnt is missing, the android build needs the runner scratch disk'
            exit 1
          fi
          available=$(df --output=avail -k /mnt | tail -n 1)
          minimum=$((40 * 1024 * 1024))
          if [ "$available" -lt "$minimum" ]; then
            echo "::error::/mnt has ${available} KiB free, the android build needs at least ${minimum} KiB"
            exit 1
          fi
          config=/etc/docker/daemon.json
          current='{}'
          if sudo test -s "$config"; then
            current=$(sudo cat "$config")
          fi
          jq '. + {"data-root": "/mnt/docker"}' <<< "$current" | sudo tee "$config" > /dev/null
          sudo systemctl restart docker
          root=$(docker info --format '{{.DockerRootDir}}')
          if [ "$root" != /mnt/docker ]; then
            echo "::error::docker data root is $root, expected /mnt/docker"
            exit 1
          fi
          sudo mkdir -p /mnt/trivy /mnt/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/trivy /mnt/tmp
          {
            echo 'TRIVY_CACHE_DIR=/mnt/trivy'
            echo 'TRIVY_TMP=/mnt/tmp'
          } >> "$GITHUB_ENV"
          df -h / /mnt

      - name: Build
        if: steps.detect.outputs.enabled == 'true'
        run: |
          make ${{ matrix.build }}
          df -h / /mnt

      - name: Scan
        if: steps.detect.outputs.enabled == 'true'
        run: |
          make scan-${{ matrix.image }}
          df -h / /mnt

      - name: Test
        if: steps.detect.outputs.enabled == 'true'
        run: make test-${{ matrix.image }}

      - if: steps.detect.outputs.enabled == 'true' && matrix.arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build, scan and smoke test arm64
        if: steps.detect.outputs.enabled == 'true' && matrix.arm64
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          image="appwrite/distribution-$IMAGE:$VERSION-arm64"
          make "scan-$IMAGE" PLATFORM=linux/arm64 TAG="$VERSION-arm64" VERSION="$VERSION"
          architecture=$(docker image inspect --format '{{.Architecture}}' "$image")
          if [ "$architecture" != arm64 ]; then
            echo "::error::$image is $architecture, expected arm64"
            exit 1
          fi
          workspace=$(mktemp -d)
          chmod 0777 "$workspace"
          case "$IMAGE" in
            tools)
              cp images/fixture/app-unsigned.aab "$workspace/app.aab"
              docker run --rm --platform linux/arm64 --network none -v "$workspace:/mnt/code" \
                -e DISTRIBUTION_ARTIFACT_TYPE=aab "$image" /usr/local/distribution/inspect.sh /mnt/code/app.aab
              ;;
            fixture)
              docker run --rm --platform linux/arm64 --network none -v "$workspace:/mnt/code" \
                -e DISTRIBUTION_VERSION_CODE=2 "$image" /usr/local/distribution/build.sh
              ;;
          esac
          test -s "$workspace/output/result.json"

      - if: steps.detect.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the images that were scanned and tested
        if: steps.detect.outputs.publish == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.detect.outputs.version }}
          ARM64: ${{ matrix.arm64 }}
        run: |
          repository="appwrite/distribution-$IMAGE"
          docker tag "$repository:$VERSION" "$repository:$VERSION-amd64"
          sources=("$repository:$VERSION-amd64")
          if [ "$ARM64" = true ]; then
            sources+=("$repository:$VERSION-arm64")
          fi
          for source in "${sources[@]}"; do
            docker push "$source"
          done
          docker buildx imagetools create --tag "$repository:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$repository:$VERSION"
